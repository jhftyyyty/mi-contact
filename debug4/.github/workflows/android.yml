name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK not found"; exit 1; }
          echo "APK found: $APK"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.3-debug4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Xiaomi Arabic Contacts Fix v1.0.3-debug4" \
              --notes "Xposed/LSPosed module: preserves the original whitespace of Arabic contact names in Xiaomi Contacts (com.android.contacts)."
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.3-debug4 \
            app/build/outputs/apk/debug/app-debug.apk \
            --clobber

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Arabic-Contacts-Fix
          path: app/build/outputs/apk/debug/app-debug.apk
